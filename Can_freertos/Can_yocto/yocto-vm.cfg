-- vim:set ft=lua:
local L4 = require("L4");
local l = L4.default_loader;
 
-- 1. Setup the Console Multiplexer
local cons = l:new_channel();
l:start({ caps = { cons = cons:svr(); }, log = L4.Env.log }, "rom/cons -a");
l.log_fab = cons;
 
-- 2. Channel for Passthrough
local io_to_uvmm = l:new_channel()
 
-- 3. Start IO Server
l:start({
  caps = {
    icu    = L4.Env.icu,
    sigma0 = L4.Env.sigma0,
    vbus_passthrough = io_to_uvmm:svr(), 
  },
}, "rom/io rom/io.cfg -v")
 
--local yocto_sched = L4.Env.user_factory:create(L4.Proto.Scheduler, 0x80, 0x60, 0x3E);  
 
-- 4. Start UVMM (Passthrough Mode)
function start_vm(num)
  -- Pinned memory is strictly required for the hardware to use DMA
  local flags = L4.Mem_alloc_flags.Continuous | L4.Mem_alloc_flags.Pinned;
  
  l:startv({
                caps = {
                 -- Reduced to 512MB to force allocation into physical Bank 0
                 ram = L4.Env.user_factory:create(L4.Proto.Dataspace, 512 * 1024 * 1024, flags, 21):m("rw");
                 vbus = io_to_uvmm, 
                 icu  = L4.Env.icu,
                },
              --  scheduler = yocto_sched,
                log = { "yocto-vm", "green" },
              },
              "rom/uvmm", "-v",
                "-i",
                "-krom/linux.bin",
                "-drom/virt.dtb",
                -- CRITICAL: Use this EXACT string to bypass the big.LITTLE crash and see logs
                "-cconsole=ttyAMA0 earlycon=pl011,mmio,0x2000 root=/dev/mmcblk0p2 rw rootwait clk_ignore_unused pd_ignore_unused");
end
 
start_vm(1)
