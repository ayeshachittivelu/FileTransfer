-- vim:set ft=lua:
local Hw = Io.Hw
local Res = Io.Res

-- 1. Renesas SDHI0 Controller (SD Card Slot)
local sdhi_phys = Hw.Device(function()
  compatible = { "renesas,sdhi-r8a7795", "renesas,rcar-gen3-sdhi" }
  Property.hid = "RCAR_SDHI0"
  Property.flags = Io.Hw_device_DF_dma_supported 
  Resource.regs = Res.mmio(0xee100000, 0xee101fff)
  Resource.irq0 = Res.irq(197)
end)

-- 2. Renesas Clock Pulse Generator (CPG)
local cpg_phys = Hw.Device(function()
  Property.hid = "RCAR_CPG"
  Resource.regs = Res.mmio(0xe6150000, 0xe6150fff)
end)

-- 3. Renesas System Controller (SYSC)
local sysc_phys = Hw.Device(function()
  Property.hid = "RCAR_SYSC"
  Resource.regs = Res.mmio(0xe6180000, 0xe6180fff)
end)

-- 4. Renesas Reset Controller (RST)
local rst_phys = Hw.Device(function()
  Property.hid = "RCAR_RST"
  Resource.regs = Res.mmio(0xe6160000, 0xe61601ff)
end)

-- 5. Renesas Pin Function Controller (PFC)
local pfc_phys = Hw.Device(function()
  Property.hid = "RCAR_PFC"
  Resource.regs = Res.mmio(0xe6060000, 0xe6060fff) -- Standardized 4KB window boundary
end)

-- 6. Renesas GPIO Bank 2 (PHY Interrupt & Reset Lines)
local gpio2_phys = Hw.Device(function()
  Property.hid = "RCAR_GPIO2"
  Resource.regs = Res.mmio(0xe6052000, 0xe605204f)
  Resource.irq0 = Res.irq(38)
end)

-- 7. Renesas Ethernet AVB Controller
local avb_phys = Hw.Device(function()
  compatible = { "renesas,etheravb-r8a7795", "renesas,etheravb-rcar-gen3" }
  Property.hid = "RCAR_AVB"
  Property.flags = Io.Hw_device_DF_dma_supported 
  Resource.regs0 = Res.mmio(0xe6800000, 0xe68007ff)
  Resource.regs1 = Res.mmio(0xe6a00000, 0xe6a0ffff)
  Resource.irq0  = Res.irq(71)
  Resource.irq1  = Res.irq(72)
  Resource.irq2  = Res.irq(73)
  Resource.irq3  = Res.irq(74)
  Resource.irq4  = Res.irq(75)
  Resource.irq5  = Res.irq(76)
  Resource.irq6  = Res.irq(77)
  Resource.irq7  = Res.irq(78)
  Resource.irq8  = Res.irq(79)
  Resource.irq9  = Res.irq(80)
  Resource.irq10 = Res.irq(81)
  Resource.irq11 = Res.irq(82)
  Resource.irq12 = Res.irq(83)
  Resource.irq13 = Res.irq(84)
  Resource.irq14 = Res.irq(85)
  Resource.irq15 = Res.irq(86)
  Resource.irq16 = Res.irq(87)
  Resource.irq17 = Res.irq(88)
  Resource.irq18 = Res.irq(89)
  Resource.irq19 = Res.irq(90)
  Resource.irq20 = Res.irq(91)
  Resource.irq21 = Res.irq(92)
  Resource.irq22 = Res.irq(93)
  Resource.irq23 = Res.irq(94)
  Resource.irq24 = Res.irq(95)
end)


-- Classic CAN 0 Controller
local can0_phys = Hw.Device(function()
  Property.hid = "RCAR_CAN0"
  Resource.regs = Res.mmio(0xe6c30000, 0xe6c30fff)
  Resource.irq0 = Res.irq(218)
end)

-- Classic CAN 1 Controller
local can1_phys = Hw.Device(function()
  Property.hid = "RCAR_CAN1"
  Resource.regs = Res.mmio(0xe6c38000, 0xe6c38fff)
  Resource.irq0 = Res.irq(219)
end)

-- 8. Renesas CAN-FD Controller (R-Car H3)
local canfd_phys = Hw.Device(function()
  compatible = { "renesas,r8a7795-canfd", "renesas,rcar-gen3-canfd" }
  Property.hid = "RCAR_CANFD"
  Property.flags = Io.Hw_device_DF_dma_supported 
  
  Resource.regs = Res.mmio(0xe66c0000, 0xe66c7fff)
  
  Resource.irq0 = Res.irq(61)  -- GIC 29
  Resource.irq1 = Res.irq(62)  -- GIC 30
end)

-- Create the Virtualized Infrastructure Bus for FreeRTOS VM
Io.add_vbusses {
  vbus_passthrough = Io.Vi.System_bus(function()
    SD_CARD  = wrap(sdhi_phys);
    CPG      = wrap(cpg_phys);   -- Directly accessible to guest code
    SYSC     = wrap(sysc_phys);
    RST      = wrap(rst_phys);
    PFC      = wrap(pfc_phys);   -- Bound to pass register PMMR checks
    GPIO2    = wrap(gpio2_phys);
    ETHERNET = wrap(avb_phys);
    CAN0     = wrap(can0_phys);  -- Pass through Classic CAN 0
    CAN1     = wrap(can1_phys);  -- Pass through Classic CAN 1
    CANFD    = wrap(canfd_phys); -- Grants direct hardware passthrough to FreeRTOS
  end)
}
