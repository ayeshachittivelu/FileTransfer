-- vim:set ft=lua:
local L4 = require("L4");
local l = L4.default_loader;

-- 1. Setup the Console Multiplexer
local cons = l:new_channel();
l:start({ 
  caps = { cons = cons:svr() }, 
  log = L4.Env.log 
}, "rom/cons -a");

l.log_fab = cons;

-- 2. Setup RAM
-- Using Continuous | Pinned and '21' to align with R-Car physical Bank 0 constraints
local flags = L4.Mem_alloc_flags.Continuous | L4.Mem_alloc_flags.Pinned;
local ram = L4.Env.user_factory:create(L4.Proto.Dataspace, 512 * 1024 * 1024, flags, 21):m("rw");

local freertos_chan = l:new_channel();

-- 3. Start UVMM with FreeRTOS
l:startv({
  caps = {
    ram    = ram,
    icu    = L4.Env.icu,
    timer  = L4.Env.ticks,
    sigma0 = L4.Env.sigma0,
    comm   = freertos_chan:svr(),
  },
  log = { "freertos-vm", "green" },
},
"rom/uvmm", "-v",
"-d", "rom/freertos-rcar.dtb",
"-k", "rom/freertos",
"-c", "console=ttyAMA0 earlycon=pl011,mmio,0x2000"
);
